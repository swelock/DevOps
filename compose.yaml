services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_ENGINE: sqlite
      DATABASE_PATH: /app/instance/campus.sqlite3
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${CONTAINER_PORT:-8000}:8000"
    volumes:
      - campus-data:/app/instance
    init: true

volumes:
  campus-data:
